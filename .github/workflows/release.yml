name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@6d88888e7a9b6418de945c26f96a468a40075b9a # v0.1.0
    secrets: inherit
    with:
      # AppUpdater downloads Berth-<version>.zip, and the shared workflow names the zip after `name`.
      name: Berth
      app: dist/Berth.app
      cask: berth
      runner: xcode-27
      signed_by_build: true
      build: |
        HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
        CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=82K3YC8HVF \
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" ./build.sh

  ios:
    name: Berth Remote IPA
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight, every iOS secret is set
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE }}
        run: |
          set -euo pipefail
          for name in IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_ADHOC_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is empty, refusing to release"
              exit 1
            fi
          done

      - name: Import the Apple Distribution certificate and Ad Hoc profile
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" \
            || { echo "::error::no Apple Distribution identity in the imported keychain"; exit 1; }
          echo "$IOS_ADHOC_PROFILE" | base64 --decode > "$RUNNER_TEMP/Berth_Remote_Ad_Hoc.mobileprovision"

      - name: Build the IPA
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          brew install xcodegen
          VERSION="${VERSION#v}" IOS_ADHOC_PROFILE_PATH="$RUNNER_TEMP/Berth_Remote_Ad_Hoc.mobileprovision" ./package-ios.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: |
            dist/BerthRemote.ipa
            dist/manifest.plist
          retention-days: 7

  publish:
    # The shared workflow creates the release, so this job only uploads to it.
    needs: [ release, ios ]
    name: IPA and install page
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios
          path: dist

      - name: Upload the IPA and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cp dist/BerthRemote.ipa "dist/BerthRemote-$version.ipa"
          gh release upload --clobber "$GITHUB_REF_NAME" "dist/BerthRemote-$version.ipa" dist/manifest.plist

      - name: Stage the install page
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          cp pages/* dist/BerthRemote.ipa dist/manifest.plist "$RUNNER_TEMP/pages/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
