name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@main
    secrets: inherit
    with:
      # AppUpdater downloads Berth-<version>.zip, and the shared workflow names the zip after `name`.
      name: Berth
      app: dist/Berth.app
      cask: berth
      runner: xcode-27
      signed_by_build: true
      build: |
        brew install xcodegen
        CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=82K3YC8HVF \
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" ./build.sh
