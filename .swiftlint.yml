included:
  - Sources
  - Packages/BerthCore/Package.swift
  - Packages/BerthCore/Sources
  - Packages/BerthCore/Tests
  - BerthRemote
  - Shared

swiftlint_version: 0.65.1
strict: true

opt_in_rules:
  - all

disabled_rules:
  # Mutually exclusive with opening_brace; the repo keeps braces on the declaration line.
  - contrasted_opening_brace
  # Conflicts with redundant_type_annotation; types are inferred unless the compiler needs them.
  - explicit_type_interface
  # Internal is the intended default; SwiftFormat's redundantInternal removes what these demand.
  - explicit_acl
  - explicit_top_level_acl
  # One-line early exits (guard ... else { return }) are the house style.
  - conditional_returns_on_newline
  - return_value_from_void_function
  # One-line switch cases are the house style; SwiftFormat's consistentSwitchCaseSpacing owns case spacing.
  - switch_case_on_newline
  - vertical_whitespace_between_cases
  # The house style is zero comments, so no doc comments.
  - missing_docs
  # Lines are not wrapped at a width (SwiftFormat --max-width none); 1,473 lines exceed 120.
  - line_length
  # SwiftUI layout constants are clearest inline (1,363 hits).
  - no_magic_numbers
  # Member and file ordering would reorder every type (449 hits) across files in flight.
  - type_contents_order
  - file_types_order
  # Files are named and grouped by feature (CLAUDE.md's module map), not one type per file.
  - one_declaration_per_file
  - file_name
  - no_grouping_extension
  # The Carets and Accessibility extensions are deliberate file splits of their classes.
  - override_in_extension
  # Case order is menu and settings order, and synthesized raw values are the persisted values.
  - sorted_enum_cases
  - explicit_enum_raw_value
  # Mutually exclusive with redundant_string_enum_value for camelCase cases; both ends share RemoteProtocol.swift.
  - raw_value_for_camel_cased_codable_enum
  # Mutually exclusive with extension_access_modifier, which agrees with SwiftFormat's extensionAccessControl.
  - no_extension_access_modifier
  # SwiftFormat owns these (sortImports, modifierOrder, indent, redundantSelf) and they disagree on details.
  - sorted_imports
  - modifier_order
  - indentation_width
  - redundant_self
  # Shadowing (let x = x, if let x) is idiomatic Swift.
  - variable_shadowing
  # Packed argument and literal lists (theme tables, JSON-RPC payloads) and SwiftUI modifier chains are deliberate.
  - multiline_arguments
  - multiline_call_arguments
  - multiline_literal_brackets
  - multiline_function_chains
  # Labelled tuples are the lightweight multi-value return here (kept up to five members, see large_tuple below).
  # String(decoding:) is deliberately lossy; the failable initializer changes behaviour.
  - optional_data_string_conversion
  # NSString and NSRange bridging is how TextKit 2 and LSP UTF-16 offsets work.
  - legacy_objc_type
  # Remaining force unwraps are of compile-time-known values: literal URLs, allCases lookups, DEBUG runtime swizzles.
  - force_unwrapping
  # Data.range(of:) is the fast byte search on the transcript prefilter paths; generic contains is not.
  - contains_over_range_nil_comparison
  # Its autocorrect rewrites `count > 0` on types whose count is a field, not a collection (compactions, menu actions).
  - empty_count
  # Its autocorrect turns `xs[i { ... }...]` into `} ...]`, which no longer parses as a postfix range.
  - closure_spacing
  # `dict[key] ?? nil` flattens a double optional; removing it changes the type.
  - redundant_nil_coalescing
  # Default parameters and their order are part of the call-site reading.
  - discouraged_default_parameter
  - function_default_parameter_at_end
  # Codable models mirror JSON where absent differs from empty or false.
  - discouraged_optional_collection
  - discouraged_optional_boolean
  # Empty overrides and no-op closures are how events are swallowed.
  - no_empty_block
  # Explicit deinits would be empty noise.
  - required_deinit
  # Swift API guidelines name constants without a k prefix.
  - prefixed_toplevel_constant
  # Playground literals; swift-format's NoPlaygroundLiterals rule says the opposite.
  - object_literal
  # fileprivate is needed for @objc swizzle targets referenced from another type in the same file.
  - strict_fileprivate
  # Protocol requirements (UNUserNotificationCenterDelegate, URLSessionTaskDelegate) fix async, @escaping and setter shapes.
  - async_without_await
  - unneeded_escaping
  - unused_setter_value
  # Its tap-gesture targets are rows and tabs holding their own controls, or a dismiss scrim; .isButton there mislabels them.
  - accessibility_trait_for_button
  # Test names refer to git's real master branch.
  - inclusive_language
  # SwiftFormat's unusedArguments owns this and autocorrects it.
  - unused_parameter

# No analyzer rules: one run needs a full build log, and unused_import fights MemberImportVisibility (CoreGraphics in Store),
# capture_variable flags deliberate [previous = task] snapshots, unused_declaration flags the @objc TextKit flush override.

attributes:
  attributes_with_arguments_always_on_line_above: false
  always_on_same_line: ["@IBAction", "@NSManaged", "@Test", "@objc", "@concurrent"]

identifier_name:
  excluded: [x, y, i, j, ys, to, up, gh, id]

number_separator:
  minimum_length: 5

trailing_comma:
  mandatory_comma: true

trailing_closure:
  only_single_muted_parameter: true

function_parameter_count:
  warning: 7

# Ceilings, not targets: they sit just above today's largest Review and Store code and catch a runaway generated function or type.
function_body_length:
  warning: 300
  error: 1000

closure_body_length:
  warning: 200
  error: 400

cyclomatic_complexity:
  warning: 50
  error: 100

type_body_length:
  warning: 2000
  error: 4000

file_length:
  warning: 2500
  error: 5000

large_tuple:
  warning: 6
  error: 8

nesting:
  type_level: 3

enum_case_associated_values_count:
  warning: 6

prohibited_super_call:
  excluded: ["doCommand(by:)"]

# Custom SwiftUI, platform and HIG rules. Comments and strings never match. A rule's exclusion names the one legitimate use.
custom_rules:
  # Bug prevention
  observable_object_legacy:
    name: Legacy Observation
    regex: '@Published\b|@StateObject\b|@EnvironmentObject\b|:\s*ObservableObject\b|@ObservedObject(?! var terminal: TerminalViewState)'
    message: 'Use @Observable with @State, @Bindable and @Environment. Only the libghostty TerminalViewState is an ObservableObject.'
  grouped_identifier_number:
    name: Grouped Identifier Number
    regex: '(Text|Label|Button|\.help|\.accessibilityLabel)\("[^"\n]*#\\\((?!String\()'
    message: 'A localized string literal groups an Int ("#1,742"). Use Text(verbatim:), or interpolate String(number) in Label, Button, .help and .accessibilityLabel.'
  unstable_view_identity:
    name: Unstable View Identity
    regex: '\.id\(UUID\(\)\)'
    message: 'A fresh id on every update destroys and recreates the view, losing its state. Use a stable id.'
  dispatch_main_sync:
    name: Dispatch Main Sync
    regex: 'DispatchQueue\.main\.sync\b'
    message: 'Deadlocks when already on the main thread. Use MainActor.assumeIsolated or an await.'
  dispatch_main_after:
    name: Dispatch Main After
    regex: 'DispatchQueue\.main\.asyncAfter\b'
    message: 'Not cancellable. Use Task.sleep(for:) in a task that ends with the view (.task) or the owner.'
  dispatch_main_async_in_remote:
    name: Dispatch Main Async
    regex: 'DispatchQueue\.main\.async\b'
    message: 'Use Task { @MainActor in } or an isolated async function. Swift 6 does not check the closure against the main actor.'
    included: 'BerthRemote/'
  blocking_sleep:
    name: Blocking Sleep
    regex: 'Thread\.sleep\b|(?<![.\w])u?sleep\('
    message: 'Blocks the thread. Use try await Task.sleep(for:).'
  task_sleep_nanoseconds:
    name: Task Sleep Nanoseconds
    regex: 'Task\.sleep\(nanoseconds:'
    message: 'Use Task.sleep(for: .seconds(1)); durations are typed and overflow-safe.'
  on_appear_task:
    name: Task Inside onAppear
    regex: '\.onAppear\s*\{\s*Task\s*\{'
    message: 'Use .task { }, which cancels when the view disappears.'
  animation_without_value:
    name: Animation Without Value
    regex: '\.animation\((nil|\.\w+(\([^()]*\))?)\)'
    message: 'The value-less .animation(_:) is deprecated and animates every change. Use .animation(_, value:) or withAnimation.'
  repeat_forever:
    name: Repeating Animation
    regex: '\.repeatForever\('
    message: 'Gate it on accessibilityReduceMotion, or drive it from a TimelineView that pauses.'

  # SwiftUI modernisation
  navigation_view:
    name: NavigationView
    regex: '\bNavigationView\b'
    message: 'Deprecated. Use NavigationStack or NavigationSplitView.'
  foreground_color:
    name: foregroundColor
    regex: '\.foregroundColor\('
    message: 'Deprecated. Use .foregroundStyle, which also takes hierarchical and gradient styles.'
  corner_radius:
    name: cornerRadius
    regex: '\.cornerRadius\('
    message: 'Deprecated on views. Use .clipShape(.rect(cornerRadius:)). Swift Charts marks have no clipShape.'
    excluded: 'Sources/StatsView\.swift'
  navigation_bar_modifiers:
    name: Navigation Bar Modifiers
    regex: '\.(navigationBarTitle|navigationBarItems|navigationBarHidden)\('
    message: 'Deprecated. Use .navigationTitle, .toolbar and .toolbarVisibility.'
  on_change_single_value:
    name: Single-Value onChange
    regex: '\.onChange\(of:[^{\n]*(perform:|\)\s*\{\s*(\[[^\]]*\]\s*)?\w+\s+in\b)'
    message: 'Deprecated. Use the two-parameter { oldValue, newValue in } or the zero-parameter form.'
  preview_provider:
    name: PreviewProvider
    regex: ':\s*PreviewProvider\b'
    message: 'Use the #Preview macro.'
  text_concatenation:
    name: Text Concatenation
    regex: 'Text\([^\n]*\)\s*\+\s*Text\('
    message: 'Text + Text is deprecated in iOS 26 and unlocalizable. Interpolate: Text("\\(Text(...)) \\(Text(...))").'
  tab_item:
    name: tabItem
    regex: '\.tabItem\s*\{'
    message: 'Use Tab(_:systemImage:) inside TabView, which gets the iOS 26 tab bar behaviours.'
  deprecated_swiftui_api:
    name: Deprecated SwiftUI API
    regex: '\.accentColor\(|\.edgesIgnoringSafeArea\(|\.autocapitalization\(|\.disableAutocorrection\(|\.actionSheet\(|\.alert\((isPresented|item):|\bpresentationMode\b|NavigationLink\(destination:|showsIndicators:|\.onReceive\(Timer'
    message: 'Deprecated. Use .tint, .ignoresSafeArea, .textInputAutocapitalization, .autocorrectionDisabled, .confirmationDialog, .alert(_:isPresented:actions:), @Environment(\.dismiss), NavigationLink(value:), .scrollIndicators, or TimelineView.'
  uiscreen_main:
    name: UIScreen.main
    regex: 'UIScreen\.main\b'
    message: 'Deprecated, and wrong in multi-window iPad. Read the size from the view (onGeometryChange, containerRelativeFrame) or the window scene.'
  any_view:
    name: AnyView
    regex: '\bAnyView\b'
    message: 'Type erasure defeats SwiftUI diffing. Use @ViewBuilder, Group or a generic.'
    excluded: 'Sources/Snapshot\.swift'
  geometry_reader:
    name: GeometryReader
    regex: '\bGeometryReader\b'
    message: 'Greedy and re-layouts its children. Use onGeometryChange, containerRelativeFrame or visualEffect unless the size must feed layout.'
    excluded: 'Sources/Harbor\.swift'

  # HIG and glass
  hand_rolled_material:
    name: Hand-Rolled Material
    regex: '\.background\(\s*\.?(ultraThin|thin|regular|thick|ultraThick)Material\b|\.background\(\.bar\)|\b(NSVisualEffectView|UIVisualEffectView|UIBlurEffect)\b'
    message: 'Bars, controls and floating panels get the system glass: .glassEffect, .buttonStyle(.glass), NSGlassEffectView, UIGlassEffect, or the stock toolbar.'
  custom_bar_background:
    name: Custom Bar Background
    regex: '\.toolbarBackground(Visibility)?\('
    message: 'Liquid Glass bars draw their own scroll edge effect. Remove the custom bar background.'
  color_components_literal:
    name: Colour Component Literal
    regex: '\b(Color|NSColor|UIColor)\((red|srgbRed|calibratedRed|deviceRed|displayP3Red|white|hue):'
    message: 'Colours come from the theme (GhosttyTheme, ReviewStyle) or semantic system colours, so Dark Mode and Increase Contrast work.'
    excluded: 'Sources/(GhosttyConfig|ReviewStyle)\.swift|BerthRemote/SyntaxPalette\.swift'

  # Accessibility (BerthRemote only: macOS has no Dynamic Type, and its tap-gesture rows are deliberate)
  fixed_font_size_in_remote:
    name: Fixed Font Size
    regex: '\.system\(size:|UIFont\.systemFont\(ofSize'
    message: 'Fixed sizes ignore Dynamic Type. Use a text style (.body, .caption), or @ScaledMetric for symbols.'
    included: 'BerthRemote/'
  tap_gesture_in_remote:
    name: Tap Gesture
    regex: '\.onTapGesture\b'
    message: 'No button trait, VoiceOver action or pointer and keyboard focus. Use Button.'
    included: 'BerthRemote/'
  fixed_black_white_in_remote:
    name: Fixed Black or White
    regex: '\.(foregroundStyle|background|foregroundColor|tint)\(\.?(Color\.)?(white|black)\)'
    message: 'Breaks in the opposite appearance. Use .primary, .secondary or a semantic colour.'
    included: 'BerthRemote/'
  uikit_feedback_generator:
    name: UIKit Feedback Generator
    regex: 'UI(Impact|Notification|Selection)FeedbackGenerator'
    message: 'Use .sensoryFeedback(_:trigger:).'
    included: 'BerthRemote/'
