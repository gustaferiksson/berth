<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review</title>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header class="rvh">
  <nav class="seg" id="compare">
    <button type="button" data-compare="allChanges">All changes</button>
    <button type="button" data-compare="uncommitted">Uncommitted</button>
    <button type="button" disabled title="Coming later">By prompt</button>
    <button type="button" data-compare="pr" id="prTab" hidden></button>
  </nav>
  <span class="meta" id="base"></span>
  <span class="meta" id="totals"></span>
  <span class="sp"></span>
  <span class="meta" id="error" hidden></span>
  <span class="meta" id="fetched"></span>
  <button type="button" class="icon" id="refresh" title="Refresh">↻</button>
</header>
<div class="rvb">
  <aside class="files">
    <nav class="seg modes" id="modes">
      <button type="button" data-mode="flat">Flat</button>
      <button type="button" data-mode="folders">Folders</button>
      <button type="button" data-mode="project">Whole project</button>
    </nav>
    <div class="tree" id="tree" tabindex="0"></div>
    <section class="cpanel" id="cpanel" hidden>
      <h4>Comments <span id="ccount"></span></h4>
      <div class="clist" id="clist"></div>
      <button type="button" class="btn pri" id="send"></button>
    </section>
  </aside>
  <main class="diffs">
    <div class="fh" id="fh" hidden></div>
    <div class="host" id="diffHost"></div>
    <div class="host" id="viewHost" hidden></div>
    <div class="notice" id="notice" hidden></div>
  </main>
</div>
<script src="vs/loader.js"></script>
<script src="review.js"></script>
</body>
</html>
