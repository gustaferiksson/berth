name: Berth
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BerthCore:
    path: Packages/BerthCore
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026102101
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    exactVersion: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    exactVersion: 0.7.4-with-generated-files
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    exactVersion: 0.23.2
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.23.1
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: 0.24.8
  TreeSitterMarkdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    exactVersion: 0.5.4
  TreeSitterYAML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: 0.7.0
  TreeSitterCSS:
    url: https://github.com/tree-sitter/tree-sitter-css
    exactVersion: 0.23.2

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Berth:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      - path: Resources/Review
        type: folder
        buildPhase: resources
    dependencies:
      - package: BerthCore
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterTypeScript
      - package: TreeSitterJavaScript
      - package: TreeSitterJSON
      - package: TreeSitterMarkdown
      - package: TreeSitterYAML
      - package: TreeSitterCSS
    entitlements:
      path: Resources/Berth.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: Berth
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.berth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Berth
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Berth"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.gustaf.berth.group
            UTTypeDescription: Berth Sidebar Group
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.gustaf.berth.pin
            UTTypeDescription: Berth Pinned Session
            UTTypeConformsTo: [public.data]
    scheme: {}
