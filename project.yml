name: Berth
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BerthCore:
    path: Packages/BerthCore
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026102101
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    exactVersion: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    exactVersion: 0.7.4-with-generated-files
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    exactVersion: 0.23.2
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.23.1
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: 0.24.8
  TreeSitterMarkdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    exactVersion: 0.5.4
  TreeSitterYAML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: 0.7.0
  TreeSitterCSS:
    url: https://github.com/tree-sitter/tree-sitter-css
    exactVersion: 0.23.2
  TreeSitterBash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    exactVersion: 0.25.1

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ImmutableWeakCaptures"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Berth:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/AppIcon.icon
      - path: Resources/highlights-typescript.scm
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: BerthCore
      - target: BerthHost
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: BerthCLI
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterTypeScript
      - package: TreeSitterJavaScript
      - package: TreeSitterJSON
      - package: TreeSitterMarkdown
      - package: TreeSitterYAML
      - package: TreeSitterCSS
      - package: TreeSitterBash
    entitlements:
      path: Resources/Berth.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: Berth
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.berth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Berth
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Berth"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.gustaf.berth.group
            UTTypeDescription: Berth Sidebar Group
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.gustaf.berth.pin
            UTTypeDescription: Berth Pinned Session
            UTTypeConformsTo: [public.data]
    scheme: {}

  BerthHost:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BerthCore/Sources/berth-host
    dependencies:
      - package: BerthCore
    settings:
      base:
        PRODUCT_NAME: berth-host
        ENABLE_HARDENED_RUNTIME: YES

  BerthCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BerthCore/Sources/berth-cli
    dependencies:
      - package: BerthCore
    settings:
      base:
        PRODUCT_NAME: berth-cli
        ENABLE_HARDENED_RUNTIME: YES

  BerthRemote:
    type: application
    platform: iOS
    sources:
      - path: BerthRemote
      - path: Packages/BerthCore/Sources/BerthCore/RemoteProtocol.swift
      - path: Packages/BerthCore/Sources/BerthCore/PlanUsage.swift
      - path: Packages/BerthCore/Sources/BerthCore/Conversation.swift
      - path: Packages/BerthCore/Sources/BerthCore/PendingPrompts.swift
      - path: Packages/BerthCore/Sources/BerthCore/MarkdownBlock.swift
      - path: Shared
      - path: Resources/AppIcon.icon
      - path: Resources/highlights-typescript.scm
        buildPhase: resources
    dependencies:
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterTypeScript
      - package: TreeSitterJavaScript
      - package: TreeSitterJSON
      - package: TreeSitterMarkdown
      - package: TreeSitterYAML
      - package: TreeSitterCSS
      - package: TreeSitterBash
    settings:
      base:
        PRODUCT_NAME: BerthRemote
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.berth.remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Berth Remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: 82K3YC8HVF
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Berth Remote Ad Hoc
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme: {}
